<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#090b14">
  <title>Pick'em Scoreboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Unbounded:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="board">
  <div class="board-wrap">
    <div class="board-top">
      <h1>Pick'em Live</h1>
      <span class="pill" id="pill">…</span>
      <span class="spacer"></span>
      <span class="meter" id="meter"></span>
    </div>
    <div class="board-grid">
      <div class="lb" id="lb"><div class="lb-empty">Loading…</div></div>
      <div class="side" id="side"></div>
    </div>
  </div>
  <script type="module" src="js/board.js"></script>
</body>
</html>
